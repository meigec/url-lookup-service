apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: development
data:
  redis.conf: |
    appendonly yes
    save ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: development
  labels:
    app: redis
    environment: development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        environment: development
    spec:
      containers:
      - name: redis
        image: meigec/redis-sec:8-alpine
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "100m"
        volumeMounts:
        - name: redis-data
          mountPath: /data
        - name: redis-config
          mountPath: /usr/local/etc/redis
        command: ["redis-server"]
        args: ["/usr/local/etc/redis/redis.conf"]
      volumes:
      - name: redis-data
        emptyDir: {}
      - name: redis-config
        configMap:
          name: redis-config
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: development
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379