apiVersion: apps/v1
kind: Deployment
metadata:
  name: url-lookup
  namespace: development
  labels:
    app: url-lookup
    environment: development
spec:
  replicas: 2
  selector:
    matchLabels:
      app: url-lookup
  template:
    metadata:
      labels:
        app: url-lookup
        environment: development
    spec:
      imagePullSecrets:
      - name: dockerhub-secret
      terminationGracePeriodSeconds: 10
      containers:
      - name: url-lookup
        image: meigec/url-lookup-service:development_placeholder
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        env:
        - name: REDIS_HOST
          value: "redis-service.development.svc.cluster.local"
        - name: REDIS_PORT
          value: "6379"
        - name: ENVIRONMENT
          value: "development"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: url-lookup-service
  namespace: development
spec:
  selector:
    app: url-lookup
  ports:
  - port: 80
    targetPort: 8080
  type: LoadBalancer